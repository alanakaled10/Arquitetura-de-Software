<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="topo(voltar)">
    <nav>
      <a th:href="@{/home}">Início</a> |
      <a th:href="@{/products}">Produtos</a> |
      <a th:href="@{/estoque}">Estoque</a>
    </nav>
    <form th:action="@{/perfil}" method="post">
      <input type="hidden" name="voltar" th:value="${voltar}">
      <label>Perfil:
        <select name="perfil" onchange="this.form.submit()">
          <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}" th:selected="${p == perfilAtual}"></option>
        </select>
      </label>
      <noscript><button type="submit">Trocar</button></noscript>
    </form>
    <p th:if="${sucesso}" th:text="${sucesso}" style="color: green"></p>
    <p th:if="${erro}" th:text="${erro}" style="color: crimson"></p>
    <hr>
  </header>
</body>
</html>
