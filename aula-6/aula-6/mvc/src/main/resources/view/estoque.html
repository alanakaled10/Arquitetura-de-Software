<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque</title>
</head>
<body>
  <div th:replace="~{fragments/layout :: topo('/estoque')}"></div>
  <h1>Estoque</h1>
  <table border="1" cellpadding="6">
    <thead>
      <tr><th>ID</th><th>Produto</th><th>Estoque</th><th>Status</th><th>Entrada</th><th>Saída</th></tr>
    </thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.stock}"></td>
        <td th:text="${p.status.descricao}"></td>
        <td>
          <form th:if="${p.status.name() != 'DESCONTINUADO'}" th:action="@{/estoque/entrada}" method="post">
            <input type="hidden" name="productId" th:value="${p.id}">
            <input type="number" name="quantidade" min="1" value="1" required style="width: 5em">
            <button type="submit">Entrada</button>
          </form>
        </td>
        <td>
          <form th:if="${p.status.name() != 'DESCONTINUADO'}" th:action="@{/estoque/saida}" method="post">
            <input type="hidden" name="productId" th:value="${p.id}">
            <input type="number" name="quantidade" min="1" value="1" required style="width: 5em">
            <button type="submit">Saída</button>
          </form>
          <span th:if="${p.status.name() == 'DESCONTINUADO'}">Produto descontinuado: sem movimentação</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(products)}"><td colspan="6">Nenhum produto cadastrado.</td></tr>
    </tbody>
  </table>
</body>
</html>
