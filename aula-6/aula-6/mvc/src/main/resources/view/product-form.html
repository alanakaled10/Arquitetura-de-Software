<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo produto</title>
</head>
<body>
  <div th:replace="~{fragments/layout :: topo('/products/new')}"></div>
  <h1>Novo produto</h1>
  <p>O produto é criado como INDISPONÍVEL e só fica disponível após uma entrada de estoque.</p>
  <form th:action="@{/products}" method="post">
    <p><label>Nome: <input type="text" name="name" required></label></p>
    <p><label>Valor: <input type="number" name="price" step="0.01" min="0" required></label></p>
    <button type="submit">Cadastrar</button>
    <a th:href="@{/products}">Cancelar</a>
  </form>
</body>
</html>
