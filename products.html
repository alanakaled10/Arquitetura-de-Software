<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos</title>
</head>
<body>
  <div th:replace="~{fragments/layout :: topo('/products')}"></div>
  <h1>Produtos</h1>
  <p><a th:href="@{/products/new}">Novo produto</a></p>
  <table border="1" cellpadding="6">
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Valor</th><th>Estoque</th><th>Status</th><th>Ações</th></tr>
    </thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${#numbers.formatDecimal(p.price, 1, 'POINT', 2, 'COMMA')}"></td>
        <td th:text="${p.stock}"></td>
        <td th:text="${p.status.descricao}"></td>
        <td>
          <form th:if="${p.status.name() != 'DESCONTINUADO' and perfilAtual.name() == 'ADM'}"
                th:action="@{/products/{id}/descontinuar(id=${p.id})}" method="post">
            <button type="submit">Descontinuar</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(products)}"><td colspan="6">Nenhum produto cadastrado.</td></tr>
    </tbody>
  </table>
</body>
</html>
